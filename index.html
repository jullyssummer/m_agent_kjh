<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간단 가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>간단 가계부</h1>
      <div class="month-nav">
        <button id="prevMonth" aria-label="이전 달">‹</button>
        <span id="currentMonth"></span>
        <button id="nextMonth" aria-label="다음 달">›</button>
      </div>
    </header>

    <section class="summary">
      <div class="summary-card income">
        <span class="label">수입</span>
        <span class="value" id="totalIncome">0원</span>
      </div>
      <div class="summary-card expense">
        <span class="label">지출</span>
        <span class="value" id="totalExpense">0원</span>
      </div>
      <div class="summary-card balance">
        <span class="label">잔액</span>
        <span class="value" id="totalBalance">0원</span>
      </div>
    </section>

    <form id="entryForm" class="entry-form">
      <div class="field-row">
        <input type="date" id="date" required>
        <select id="type">
          <option value="expense">지출</option>
          <option value="income">수입</option>
        </select>
      </div>
      <div class="field-row">
        <select id="category"></select>
        <input type="text" id="memo" placeholder="메모 (선택)">
      </div>
      <div class="field-row">
        <input type="number" id="amount" placeholder="금액" min="0" step="1" required>
        <button type="submit">추가</button>
      </div>
    </form>

    <section class="list-section">
      <ul id="entryList" class="entry-list"></ul>
      <p id="emptyMessage" class="empty-message">이번 달 내역이 없습니다.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
